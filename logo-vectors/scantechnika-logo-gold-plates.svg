<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Scan Technika logotipas">
  <defs>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C97B"/>
      <stop offset="35%" stop-color="#F7E3A3"/>
      <stop offset="65%" stop-color="#C99E42"/>
      <stop offset="100%" stop-color="#9A7225"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BE"/>
      <stop offset="28%" stop-color="#E6C36B"/>
      <stop offset="52%" stop-color="#FBF0C4"/>
      <stop offset="76%" stop-color="#C69638"/>
      <stop offset="100%" stop-color="#8F651D"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C2"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#6B4C13"/>
    </linearGradient>
    <linearGradient id="forestGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6040"/>
      <stop offset="50%" stop-color="#14452F"/>
      <stop offset="100%" stop-color="#0B291B"/>
    </linearGradient>
    <linearGradient id="steelRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8CFC0"/>
      <stop offset="50%" stop-color="#9A8E7A"/>
      <stop offset="100%" stop-color="#6B5F4C"/>
    </linearGradient>
    <radialGradient id="orbBronze" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFF4D2"/>
      <stop offset="35%" stop-color="#D4AE6A"/>
      <stop offset="75%" stop-color="#6D5025"/>
      <stop offset="100%" stop-color="#2E1F0C"/>
    </radialGradient>
    <radialGradient id="cyanHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="32%" stop-color="#7CF3FF" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#00D4FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayDiag" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="28%" stop-color="#5CEBFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="72%" stop-color="#5CEBFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="32%" stop-color="#6DF0FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="68%" stop-color="#6DF0FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="32%" stop-color="#6DF0FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="68%" stop-color="#6DF0FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-12%" width="118%" height="132%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0C2418" flood-opacity="0.22"/>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left brushed gold plate -->
  <rect x="82" y="22" width="224" height="116" rx="14" fill="url(#goldPlate)" stroke="url(#goldBorder)" stroke-width="3" filter="url(#softShadow)"/>
  <rect x="86" y="26" width="216" height="108" rx="11" fill="none" stroke="#FFF6D6" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Right brushed gold plate -->
  <rect x="322" y="22" width="304" height="116" rx="14" fill="url(#goldPlate)" stroke="url(#goldBorder)" stroke-width="3" filter="url(#softShadow)"/>
  <rect x="326" y="26" width="296" height="108" rx="11" fill="none" stroke="#FFF6D6" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Wordmark on gold plates -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="60" letter-spacing="-0.5">
    <text x="150" y="99" fill="#FFF1B8" opacity="0.7" dx="1.5" dy="1.5">Scan</text>
    <text x="150" y="99" fill="#13422C">Scan</text>
    <text x="345" y="99" fill="#FFF1B8" opacity="0.7" dx="1.5" dy="1.5">Technika</text>
    <text x="345" y="99" fill="#13422C">Technika</text>
  </g>

  <!-- Geometric faceted S emblem with golden inner ribbon + glowing cyan starburst -->
  <g transform="translate(14, 6)">
    <g filter="url(#softShadow)">
      <!-- Background subtle metallic ring -->
      <circle cx="64" cy="74" r="46" fill="none" stroke="url(#steelRing)" stroke-width="3" opacity="0.8"/>

      <!-- Outer dark-green S base frame -->
      <path d="M68 8 L118 40 L94 56 L66 38 L44 52 L106 90 L106 106 L58 140 L10 108 L34 92 L62 110 L84 96 L22 58 L22 42 Z"
            fill="url(#forestGreen)" stroke="#0B281B" stroke-width="3" stroke-linejoin="miter"/>

      <!-- Bold brushed-gold inner S ribbon (center bar + upper-left & lower-right bevels) -->
      <path d="M68 15 L81 23 L35 51 L100 92 L100 104 L58 133 L45 125 L91 97 L28 57 L28 45 Z"
            fill="url(#goldRibbon)" stroke="#0E3322" stroke-width="1.4" stroke-linejoin="miter"/>

      <!-- Top-right & bottom-left forest green beveled facets with gold inner highlight -->
      <polygon points="81,23 111,41 94,52 67,35" fill="url(#forestGreen)" stroke="#E8C76F" stroke-width="1.2"/>
      <polygon points="45,125 17,107 34,96 61,113" fill="url(#forestGreen)" stroke="#E8C76F" stroke-width="1.2"/>

      <!-- Crisp bright gold specular ridge down the center of the golden ribbon -->
      <path d="M68 19 L33 48 L33 54 L94 93 L94 101 L58 128" fill="none" stroke="#FFF7D6" stroke-width="1.5" stroke-opacity="0.75"/>
    </g>

    <!-- Luminous cyan-white 6-ray starburst flare -->
    <g filter="url(#cyanGlow)">
      <circle cx="64" cy="74" r="29" fill="url(#cyanHalo)"/>
      <polygon points="60,70 132,-2 68,78 -4,150" fill="url(#rayDiag)"/>
      <polygon points="64,6 67,74 64,142 61,74" fill="url(#rayVert)"/>
      <polygon points="4,74 64,71 124,74 64,77" fill="url(#rayHoriz)"/>
    </g>

    <!-- Center metallic bronze orb with glowing teal-cyan collar -->
    <circle cx="64" cy="74" r="12.5" fill="#1B8F9C" stroke="#99F6FF" stroke-width="1.8"/>
    <circle cx="64" cy="74" r="8.2" fill="url(#orbBronze)" stroke="#0D3B42" stroke-width="1"/>
  </g>
</svg>
