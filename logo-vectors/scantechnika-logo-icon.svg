<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Scan Technika ženklas">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5A3D"/>
      <stop offset="100%" stop-color="#0E3021"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BE"/>
      <stop offset="28%" stop-color="#E6C36B"/>
      <stop offset="52%" stop-color="#FBF0C4"/>
      <stop offset="76%" stop-color="#C69638"/>
      <stop offset="100%" stop-color="#8F651D"/>
    </linearGradient>
    <radialGradient id="orbBronze3" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFF4D2"/>
      <stop offset="40%" stop-color="#D4AE6A"/>
      <stop offset="80%" stop-color="#6D5025"/>
      <stop offset="100%" stop-color="#2E1F0C"/>
    </radialGradient>
    <radialGradient id="cyanHalo3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#7CF3FF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00D4FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayDiag3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="28%" stop-color="#5CEBFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="72%" stop-color="#5CEBFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayVert3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="32%" stop-color="#6DF0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="68%" stop-color="#6DF0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayHoriz3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="32%" stop-color="#6DF0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="68%" stop-color="#6DF0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="cyanGlow3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <g transform="translate(13, 6) scale(0.79)">
    <path d="M68 8 L118 40 L94 56 L66 38 L44 52 L106 90 L106 106 L58 140 L10 108 L34 92 L62 110 L84 96 L22 58 L22 42 Z"
          fill="#14452F" stroke="#092116" stroke-width="3" stroke-linejoin="miter"/>

    <!-- Bold brushed-gold inner S ribbon -->
    <path d="M68 15 L81 23 L35 51 L100 92 L100 104 L58 133 L45 125 L91 97 L28 57 L28 45 Z"
          fill="url(#goldGrad)" stroke="#0B281B" stroke-width="1.5" stroke-linejoin="miter"/>

    <polygon points="81,23 111,41 94,52 67,35" fill="#175237" stroke="#E8C76F" stroke-width="1.3"/>
    <polygon points="45,125 17,107 34,96 61,113" fill="#175237" stroke="#E8C76F" stroke-width="1.3"/>
    <path d="M68 19 L33 48 L33 54 L94 93 L94 101 L58 128" fill="none" stroke="#FFF7D6" stroke-width="1.5" stroke-opacity="0.75"/>

    <!-- Cyan-white starburst flare -->
    <g filter="url(#cyanGlow3)">
      <circle cx="64" cy="74" r="30" fill="url(#cyanHalo3)"/>
      <polygon points="60,70 128,2 68,78 0,146" fill="url(#rayDiag3)"/>
      <polygon points="64,6 67,74 64,142 61,74" fill="url(#rayVert3)"/>
      <polygon points="6,74 64,71 122,74 64,77" fill="url(#rayHoriz3)"/>
    </g>

    <!-- Center bronze orb with cyan ring -->
    <circle cx="64" cy="74" r="13" fill="#1B8F9C" stroke="#99F6FF" stroke-width="2"/>
    <circle cx="64" cy="74" r="8.2" fill="url(#orbBronze3)" stroke="#0D3B42" stroke-width="1"/>
  </g>
</svg>
